version: "3"

services:
  cyrostat-backend:
    build:
      context: ./cryostat_backend
      dockerfile: Dockerfile
    container_name: cryostat-backend
    devices:
      - /dev/bus/usb:/dev/bus/usb  # Allow USB access (TODO: Check Mac compatibility)
      - /dev:/dev  # Allow access to other devices
    ports:
      - "8000:8000"  # Expose FastAPI on port 8000
    networks:
      - instrument-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cryostat-frontend
    devices:
      - /dev/bus/usb:/dev/bus/usb  # Allow frontend to access USB port (TODO: Check Mac compatibility)
    depends_on:
      backend:
        condition: service_healthy  # Ensure backend is ready before starting frontend
    ports:
      - "8050:8050"  # Expose dash on port 8050
    networks:
      - instrument-net
    restart: no

networks:
  instrument-net:
    driver: bridge
