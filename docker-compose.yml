version: "3"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: cryostat-backend
    devices:
      - /dev/bus/usb:/dev/bus/usb  # Allow backend to access USB port TODO: Check Mac compatibility
      - /dev:/dev # Allow backend to access devices
    ports:
      - "8000:8000"  # Expose FastAPI on port 8000
    networks:
      - cryostat-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: cryostat-frontend
    devices:
      - /dev/bus/usb:/dev/bus/usb  # Allow frontend to access USB port TODO: Check Mac compatibility
    depends_on:
      - backend  # Ensure backend starts first
    ports:
      - "8501:8501"  # Expose Streamlit on port 8501
    networks:
      - cryostat-net
    restart: unless-stopped

networks:
  cryostat-net:
    driver: bridge
