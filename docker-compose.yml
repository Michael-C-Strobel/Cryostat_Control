version: "3"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: cryostat-backend
    ports:
      - "8000:8000"  # Expose FastAPI on port 8000
    networks:
      - cryostat-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: cryostat-frontend
    depends_on:
      - backend  # Ensure backend starts first
    ports:
      - "8501:8501"  # Expose Streamlit on port 8501
    networks:
      - cryostat-net
    restart: unless-stopped

networks:
  cryostat-net:
    driver: bridge
